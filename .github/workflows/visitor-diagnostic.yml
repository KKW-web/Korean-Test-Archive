name: Diagnose public visitor counter
on:
  push:
    branches: [diagnose-visitor-counter-20261107]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public counter responses without adding visits
        shell: python
        run: |
          import urllib.request, urllib.error, json
          urls = [
            'https://kkw-korean-archive.goatcounter.com/counter/TOTAL.json',
            'https://kkw-korean-archive.goatcounter.com/counter/%2FKorean-Test-Archive%2F.json',
            'https://kkw-korean-archive.goatcounter.com/counter/%2FKorean-Test-Archive%2F.json?start=2026-11-07',
            'https://kkw.goatcounter.com/counter/TOTAL.json',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'Origin':'https://kkw-web.github.io'})
              with urllib.request.urlopen(req, timeout=20) as r:
                print(json.dumps({'url':url,'status':r.status,'cors':r.headers.get('Access-Control-Allow-Origin'),'body':r.read(1200).decode('utf8','replace')}))
            except urllib.error.HTTPError as e:
              print(json.dumps({'url':url,'status':e.code,'cors':e.headers.get('Access-Control-Allow-Origin'),'body':e.read(1200).decode('utf8','replace')}))
            except Exception as e:
              print(json.dumps({'url':url,'error':str(e)}))
